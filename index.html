<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b0d11" />
  <title>Famille Fontenay — Album</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090b0f;
      --bg-header: rgba(9, 11, 15, 0.86);
      --bg-card: #141821;
      --bg-pill: #181d28;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --accent: #f59e0b;
      --accent-soft: rgba(245, 158, 11, 0.16);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    html.light {
      --bg: #f8f6f2;
      --bg-header: rgba(248, 246, 242, 0.88);
      --bg-card: #ffffff;
      --bg-pill: #ede9e0;
      --border: rgba(0, 0, 0, 0.08);
      --text: #18181b;
      --text-muted: #71717a;
      --accent: #d97706;
      --accent-soft: rgba(217, 119, 6, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: calc(24px + var(--safe-bottom));
    }

    /* Sticky Compact Mobile-First Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--bg-header);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding-top: var(--safe-top);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 10px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-count {
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      height: 34px;
      min-width: 34px;
      padding: 0 10px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--bg-pill);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
    }

    .icon-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Collapsible Search & Filters Row */
    .search-row {
      display: none;
      gap: 8px;
      align-items: center;
    }

    .search-row.open {
      display: flex;
    }

    .search-input-wrap {
      position: relative;
      flex: 1;
    }

    .search-input-wrap input {
      width: 100%;
      height: 36px;
      padding: 0 32px 0 34px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-pill);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    .search-input-wrap input:focus {
      border-color: var(--accent);
    }

    .search-input-wrap .s-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: var(--text-muted);
    }

    .clear-search {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      display: none;
    }

    /* Horizontal Scrollable Theme Chips */
    .chips-scroll {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-bottom: 2px;
      margin: 0 -14px;
      padding-left: 14px;
      padding-right: 14px;
    }

    .chips-scroll::-webkit-scrollbar {
      display: none;
    }

    .theme-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--bg-pill);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .theme-chip .chip-count {
      font-size: 11px;
      opacity: 0.7;
      font-weight: 500;
    }

    .theme-chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .theme-chip.active .chip-count {
      opacity: 0.95;
    }

    /* Secondary Sub-filters (Years + Sort) */
    .subbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      margin: 0 -14px;
      padding: 2px 14px 0;
    }

    .subbar::-webkit-scrollbar {
      display: none;
    }

    .year-chips {
      display: flex;
      gap: 5px;
      flex-shrink: 0;
    }

    .year-btn {
      padding: 4px 10px;
      border-radius: 99px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .year-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: rgba(245, 158, 11, 0.3);
    }

    .sort-toggle {
      padding: 4px 9px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-pill);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 600;
      flex-shrink: 0;
      cursor: pointer;
    }

    /* Main Gallery Container */
    .gallery-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 8px 2px 30px;
    }

    @media (min-width: 700px) {
      .gallery-wrap {
        padding: 16px 14px 40px;
      }
    }

    .month-block {
      margin-bottom: 18px;
    }

    .month-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 8px 12px 6px;
    }

    .month-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .month-sub {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Apple Photos / Google Photos style tight 3-col mobile grid */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
    }

    @media (min-width: 640px) {
      .photo-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
    }

    @media (min-width: 960px) {
      .photo-grid {
        grid-template-columns: repeat(6, 1fr);
        gap: 8px;
      }
    }

    .photo-cell {
      position: relative;
      aspect-ratio: 1 / 1;
      background: var(--bg-card);
      overflow: hidden;
      cursor: pointer;
      user-select: none;
    }

    @media (min-width: 640px) {
      .photo-cell {
        border-radius: 10px;
      }
    }

    .photo-cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cell-badges {
      position: absolute;
      bottom: 4px;
      left: 4px;
      right: 4px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
    }

    .cell-caption-dot {
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 6px;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
    }

    .cell-fav-indicator {
      position: absolute;
      top: 5px;
      right: 5px;
      font-size: 12px;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.8));
      pointer-events: none;
    }

    .load-more-box {
      padding: 22px 16px;
      text-align: center;
    }

    .load-more-btn {
      width: 100%;
      max-width: 320px;
      padding: 13px 20px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Fullscreen Mobile-First Lightbox with Touch Swipe */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #000;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      touch-action: pan-y;
    }

    .lightbox.open {
      display: flex;
    }

    .lb-topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: calc(10px + var(--safe-top)) 14px 12px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
    }

    .lb-meta-top {
      display: flex;
      flex-direction: column;
    }

    .lb-date {
      font-size: 14px;
      font-weight: 700;
    }

    .lb-sub {
      font-size: 11.5px;
      color: rgba(255,255,255,0.75);
    }

    .lb-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lb-btn {
      height: 36px;
      min-width: 36px;
      padding: 0 11px;
      border-radius: 99px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(20, 24, 33, 0.7);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
    }

    .lb-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .lb-stage img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      transition: transform 0.18s ease;
    }

    .lb-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.5);
      color: #fff;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .lb-arrow.prev { left: 10px; }
    .lb-arrow.next { right: 10px; }

    @media (max-width: 640px) {
      .lb-arrow {
        width: 36px;
        height: 36px;
        font-size: 18px;
        background: rgba(0,0,0,0.35);
      }
    }

    /* Bottom Sheet Info inside Lightbox */
    .lb-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 16px 14px calc(14px + var(--safe-bottom));
      background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.68) 70%, transparent 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 42vh;
      overflow-y: auto;
    }

    .lb-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
    }

    .lb-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .lb-tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 99px;
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-weight: 600;
    }

    .lb-wa-box {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 2px;
    }

    .lb-wa-msg {
      background: rgba(16, 185, 129, 0.18);
      border-left: 3px solid #10b981;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.35;
    }

    .lb-wa-author {
      font-weight: 700;
      color: #34d399;
      margin-right: 6px;
    }
  </style>
</head>
<body>

  <!-- Compact Sticky Header -->
  <header class="app-header">
    <div class="header-inner">
      <div class="top-row">
        <div class="brand">
          <div class="brand-icon">📸</div>
          <div class="brand-text">
            <div class="brand-title" id="header-title">Famille Fontenay</div>
            <div class="brand-count" id="header-count">1 432 photos</div>
          </div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="btn-search-toggle" title="Rechercher">🔍</button>
          <button class="icon-btn" id="btn-slideshow" title="Diaporama">▶</button>
          <button class="icon-btn" id="btn-theme-mode" title="Thème clair/sombre">☀️</button>
        </div>
      </div>

      <!-- Collapsible Search Bar -->
      <div class="search-row" id="search-row">
        <div class="search-input-wrap">
          <span class="s-icon">🔍</span>
          <input type="search" id="search-input" placeholder="Chercher (Émile, crabe, Yport, Corse, ski, golf...)" />
          <button class="clear-search" id="btn-clear-search">✕</button>
        </div>
      </div>

      <!-- Horizontal Theme Pills (1-tap on mobile) -->
      <div class="chips-scroll" id="theme-chips"></div>

      <!-- Compact Year & Sort Bar -->
      <div class="subbar">
        <div class="year-chips" id="year-chips"></div>
        <select class="sort-toggle" id="sort-select">
          <option value="desc">↓ Récentes</option>
          <option value="asc">↑ Anciennes</option>
          <option value="faces">👨‍👩‍👧‍👦 Groupes</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Photo Grid -->
  <main class="gallery-wrap">
    <div id="gallery-container"></div>
    <div class="load-more-box" id="load-more-wrap" style="display:none;">
      <button class="load-more-btn" id="btn-load-more">Voir plus de photos</button>
    </div>
  </main>

  <!-- Fullscreen Touch Lightbox -->
  <div class="lightbox" id="lightbox">
    <div class="lb-topbar">
      <div class="lb-meta-top">
        <div class="lb-date" id="lb-date"></div>
        <div class="lb-sub" id="lb-sub"></div>
      </div>
      <div class="lb-actions">
        <button class="lb-btn" id="lb-fav">🤍</button>
        <a class="lb-btn" id="lb-dl" href="#" download>⬇</a>
        <button class="lb-btn" id="lb-close">✕</button>
      </div>
    </div>

    <div class="lb-stage" id="lb-stage">
      <button class="lb-arrow prev" id="lb-prev">‹</button>
      <img id="lb-img" src="" alt="" />
      <button class="lb-arrow next" id="lb-next">›</button>
    </div>

    <div class="lb-bottom" id="lb-bottom">
      <div class="lb-title" id="lb-title"></div>
      <div class="lb-tags" id="lb-tags"></div>
      <div class="lb-wa-box" id="lb-wa-box"></div>
    </div>
  </div>

  <script src="data/catalog.js"></script>
  <script>
    (function() {
      const catalog = window.FAMILLE_FONTENAY_CATALOG;
      if (!catalog) return;

      const MONTHS_FR = ["", "Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
      const SHORT_THEME_NAMES = {
        "emile": "Émile",
        "mer_vacances": "Mer & Corse",
        "nature_balades": "Jardin & Ferme",
        "maison_cocooning": "Maison",
        "famille_fetes": "Fêtes & Famille",
        "repas_gastronomie": "À Table",
        "montagne_sport": "Ski & Sport",
        "souvenirs_docs": "Souvenirs"
      };

      const themeMap = {};
      catalog.themes.forEach(t => { themeMap[t.id] = t; });

      let state = {
        theme: "all",
        year: "all",
        search: "",
        sort: "desc",
        limit: 180,
        filtered: [],
        lbIndex: -1,
        slideshowTimer: null,
        favorites: new Set(JSON.parse(localStorage.getItem("ff_favorites") || "[]"))
      };

      function saveFavs() {
        localStorage.setItem("ff_favorites", JSON.stringify([...state.favorites]));
      }

      function renderControls() {
        // Theme chips
        const chipsEl = document.getElementById("theme-chips");
        chipsEl.innerHTML = "";

        const baseChips = [
          { id: "all", icon: "✨", label: "Tout", count: catalog.total_photos },
          ...catalog.themes.map(t => ({
            id: t.id,
            icon: t.icon,
            label: SHORT_THEME_NAMES[t.id] || t.title.split("—")[0].trim(),
            count: t.total_associated
          })),
          { id: "with_caption", icon: "💬", label: "Messages", count: catalog.photos.filter(p => p.caption || (p.nearby_messages && p.nearby_messages.length > 0)).length },
          { id: "favorites", icon: "❤️", label: "Favoris", count: state.favorites.size }
        ];

        baseChips.forEach(c => {
          const btn = document.createElement("button");
          btn.className = "theme-chip" + (state.theme === c.id ? " active" : "");
          btn.innerHTML = `<span>${c.icon}</span><span>${c.label}</span><span class="chip-count">${c.count}</span>`;
          btn.onclick = () => {
            state.theme = (state.theme === c.id && c.id !== "all") ? "all" : c.id;
            state.limit = 180;
            renderControls();
            applyFilters();
            window.scrollTo({ top: 0, behavior: "smooth" });
          };
          chipsEl.appendChild(btn);
        });

        // Year chips
        const yearEl = document.getElementById("year-chips");
        yearEl.innerHTML = "";
        const years = ["all", ...Object.keys(catalog.years).reverse()];
        years.forEach(yr => {
          const b = document.createElement("button");
          b.className = "year-btn" + (state.year === yr ? " active" : "");
          b.textContent = yr === "all" ? "Toutes" : yr;
          b.onclick = () => {
            state.year = (state.year === yr && yr !== "all") ? "all" : yr;
            state.limit = 180;
            renderControls();
            applyFilters();
          };
          yearEl.appendChild(b);
        });
      }

      function applyFilters() {
        const q = state.search.trim().toLowerCase();
        let list = catalog.photos.filter(p => {
          if (state.theme === "favorites") {
            if (!state.favorites.has(p.id)) return false;
          } else if (state.theme === "with_caption") {
            if (!p.caption && (!p.nearby_messages || p.nearby_messages.length === 0)) return false;
          } else if (state.theme !== "all") {
            if (!p.themes || !p.themes.includes(state.theme)) return false;
          }

          if (state.year !== "all" && p.year !== state.year) return false;

          if (q) {
            const hay = [
              p.title,
              p.caption,
              p.sender,
              p.date,
              ...(p.tags || []),
              ...(p.nearby_messages || []).map(m => m.text)
            ].join(" ").toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });

        if (state.sort === "asc") {
          list.sort((a, b) => a.timestamp - b.timestamp);
        } else if (state.sort === "desc") {
          list.sort((a, b) => b.timestamp - a.timestamp);
        } else if (state.sort === "faces") {
          list.sort((a, b) => (b.face_count - a.face_count) || (b.timestamp - a.timestamp));
        }

        state.filtered = list;
        document.getElementById("header-count").textContent = `${list.length.toLocaleString("fr-FR")} photo${list.length > 1 ? "s" : ""}`;
        renderGallery();
      }

      function renderGallery() {
        const container = document.getElementById("gallery-container");
        container.innerHTML = "";

        const visible = state.filtered.slice(0, state.limit);
        if (visible.length === 0) {
          container.innerHTML = `<div style="padding:60px 20px; text-align:center; color:var(--text-muted); font-size:14px;">Aucune photo trouvée.</div>`;
          document.getElementById("load-more-wrap").style.display = "none";
          return;
        }

        const groups = new Map();
        visible.forEach((p, idx) => {
          p._idx = idx;
          if (!groups.has(p.month)) groups.set(p.month, []);
          groups.get(p.month).push(p);
        });

        groups.forEach((items, monthStr) => {
          const [y, m] = monthStr.split("-");
          const mLabel = `${MONTHS_FR[parseInt(m, 10)]} ${y}`;

          const block = document.createElement("section");
          block.className = "month-block";
          block.innerHTML = `
            <div class="month-header">
              <div class="month-title">${mLabel}</div>
              <div class="month-sub">${items.length}</div>
            </div>
          `;

          const grid = document.createElement("div");
          grid.className = "photo-grid";

          items.forEach(p => {
            const cell = document.createElement("div");
            cell.className = "photo-cell";
            const isFav = state.favorites.has(p.id);
            cell.innerHTML = `
              <img src="${p.thumb}" alt="" loading="lazy" />
              ${isFav ? `<span class="cell-fav-indicator">❤️</span>` : ""}
              ${p.caption ? `<div class="cell-badges"><span class="cell-caption-dot">💬 ${p.caption}</span></div>` : ""}
            `;
            cell.onclick = () => openLightbox(p._idx);
            grid.appendChild(cell);
          });

          block.appendChild(grid);
          container.appendChild(block);
        });

        const loadMoreWrap = document.getElementById("load-more-wrap");
        if (state.filtered.length > state.limit) {
          loadMoreWrap.style.display = "block";
          document.getElementById("btn-load-more").textContent = `Afficher plus (${state.filtered.length - state.limit} restantes)`;
        } else {
          loadMoreWrap.style.display = "none";
        }
      }

      // Lightbox
      function openLightbox(idx) {
        if (idx < 0 || idx >= state.filtered.length) return;
        state.lbIndex = idx;
        const p = state.filtered[idx];
        const lb = document.getElementById("lightbox");
        lb.classList.add("open");
        document.body.style.overflow = "hidden";

        const lbImg = document.getElementById("lb-img");
        lbImg.onerror = () => {
          if (lbImg.src !== p.thumb) lbImg.src = p.thumb;
        };
        lbImg.src = window.location.hostname.includes("github.io") ? p.thumb : p.path;

        const tm = themeMap[p.theme];
        document.getElementById("lb-date").textContent = `${p.date.split("-").reverse().join("/")} • ${p.time}`;
        document.getElementById("lb-sub").textContent = `${idx + 1}/${state.filtered.length} • ${tm ? tm.icon + " " + (SHORT_THEME_NAMES[p.theme] || tm.title) : ""}`;
        document.getElementById("lb-title").textContent = p.caption || p.title;

        const isFav = state.favorites.has(p.id);
        document.getElementById("lb-fav").textContent = isFav ? "❤️" : "🤍";

        const dl = document.getElementById("lb-dl");
        dl.href = window.location.hostname.includes("github.io") ? p.thumb : p.path;
        dl.download = p.filename;

        // Tags
        const tagsEl = document.getElementById("lb-tags");
        tagsEl.innerHTML = "";
        if (p.sender && p.sender !== "Famille Fontenay") {
          const s = document.createElement("span");
          s.className = "lb-tag";
          s.textContent = "👤 " + p.sender;
          tagsEl.appendChild(s);
        }
        (p.tags || []).slice(0, 4).forEach(t => {
          const s = document.createElement("span");
          s.className = "lb-tag";
          s.textContent = t;
          tagsEl.appendChild(s);
        });

        // WhatsApp messages
        const waBox = document.getElementById("lb-wa-box");
        waBox.innerHTML = "";
        const msgs = (p.nearby_messages || []).slice(0, 3);
        msgs.forEach(m => {
          if (m.text === p.caption) return;
          const div = document.createElement("div");
          div.className = "lb-wa-msg";
          div.innerHTML = `<span class="lb-wa-author">${m.sender.split(" ")[0]}:</span>${m.text}`;
          waBox.appendChild(div);
        });
      }

      function closeLightbox() {
        stopSlideshow();
        document.getElementById("lightbox").classList.remove("open");
        document.body.style.overflow = "";
        state.lbIndex = -1;
      }

      function stopSlideshow() {
        if (state.slideshowTimer) {
          clearInterval(state.slideshowTimer);
          state.slideshowTimer = null;
          document.getElementById("btn-slideshow").classList.remove("active");
        }
      }

      // Touch swipe inside Lightbox
      let touchStartX = 0;
      let touchStartY = 0;
      const stage = document.getElementById("lb-stage");
      stage.addEventListener("touchstart", (e) => {
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      stage.addEventListener("touchend", (e) => {
        if (e.changedTouches.length === 1) {
          const dx = e.changedTouches[0].clientX - touchStartX;
          const dy = e.changedTouches[0].clientY - touchStartY;
          if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) {
            if (dx < 0) document.getElementById("lb-next").click();
            else document.getElementById("lb-prev").click();
          } else if (dy > 80 && Math.abs(dy) > Math.abs(dx)) {
            closeLightbox();
          }
        }
      }, { passive: true });

      // UI Events
      const searchRow = document.getElementById("search-row");
      const searchInput = document.getElementById("search-input");
      const clearBtn = document.getElementById("btn-clear-search");

      document.getElementById("btn-search-toggle").onclick = (e) => {
        const isOpen = searchRow.classList.toggle("open");
        e.currentTarget.classList.toggle("active", isOpen);
        if (isOpen) searchInput.focus();
      };

      searchInput.oninput = (e) => {
        state.search = e.target.value;
        clearBtn.style.display = state.search ? "block" : "none";
        state.limit = 180;
        applyFilters();
      };

      clearBtn.onclick = () => {
        searchInput.value = "";
        state.search = "";
        clearBtn.style.display = "none";
        applyFilters();
      };

      document.getElementById("sort-select").onchange = (e) => {
        state.sort = e.target.value;
        applyFilters();
      };

      document.getElementById("btn-theme-mode").onclick = (e) => {
        const isLight = document.documentElement.classList.toggle("light");
        e.currentTarget.textContent = isLight ? "🌙" : "☀️";
      };

      document.getElementById("btn-load-more").onclick = () => {
        state.limit += 240;
        renderGallery();
      };

      document.getElementById("btn-slideshow").onclick = (e) => {
        if (state.slideshowTimer) {
          stopSlideshow();
          return;
        }
        if (state.filtered.length === 0) return;
        if (state.lbIndex === -1) openLightbox(0);
        e.currentTarget.classList.add("active");
        state.slideshowTimer = setInterval(() => {
          openLightbox((state.lbIndex + 1) % state.filtered.length);
        }, 3200);
      };

      document.getElementById("lb-close").onclick = closeLightbox;
      document.getElementById("lb-prev").onclick = (e) => {
        e.stopPropagation();
        openLightbox((state.lbIndex - 1 + state.filtered.length) % state.filtered.length);
      };
      document.getElementById("lb-next").onclick = (e) => {
        e.stopPropagation();
        openLightbox((state.lbIndex + 1) % state.filtered.length);
      };
      document.getElementById("lb-fav").onclick = () => {
        const p = state.filtered[state.lbIndex];
        if (!p) return;
        if (state.favorites.has(p.id)) state.favorites.delete(p.id);
        else state.favorites.add(p.id);
        saveFavs();
        openLightbox(state.lbIndex);
        renderControls();
        renderGallery();
      };

      window.addEventListener("keydown", (e) => {
        if (state.lbIndex === -1) return;
        if (e.key === "Escape") closeLightbox();
        if (e.key === "ArrowLeft") document.getElementById("lb-prev").click();
        if (e.key === "ArrowRight") document.getElementById("lb-next").click();
      });

      renderControls();
      applyFilters();
    })();
  </script>
</body>
</html>
